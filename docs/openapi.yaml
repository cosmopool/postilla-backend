openapi: 3.1.0
info:
  title: Postilla story feed backend
  version: 1.0.0
  description: |
    Tells the Postilla app which story translations were published or removed since it last
    asked, and takes the stories the `postilla` CLI publishes. The full design is in
    [specification.md](specification.md); this file mirrors its endpoints and must change
    with it. The binary layouts are also in Kaitai Struct form, one file per body, in
    [formats/](formats/). Server-side drafts are v1.2 ([roadmap.md](roadmap.md#v12-drafts)).

    ## Binary bodies

    Every structured body is binary (`application/octet-stream`), big-endian (network byte
    order), with no padding:

    | Type | Encoding |
    |---|---|
    | `u8`, `u16`, `u32` | Unsigned integers of 1, 2 and 4 bytes |
    | `str` | `u32` byte length, then that many bytes of UTF-8 |
    | `uuid` | 16 bytes: the UUID's 32 hex digits as bytes in written order |
    | `lang` | 8 bytes: a language id (a BCP 47 tag) in ASCII, zero-padded (`it\0\0\0\0\0\0`, `pt-BR\0\0\0`) |
    | `sha256` | 32 bytes |

    Every structured body starts with a 4-byte ASCII magic and a `u8` version (`1` for every
    format here). A request whose magic is wrong or whose version is unknown gets a 400.

    | Magic | Body | Kaitai |
    |---|---|---|
    | `FEED` | `GET /stories` response | `feed.ksy` |
    | `GNRS` | `GET /genres` response | `gnrs.ksy` |
    | `TAGS` | `GET /tags` response | `tags.ksy` |
    | `AUTH` | `GET /authors` response | `auth.ksy` |
    | `LANG` | `GET /languages` response | `lang.ksy` |
    | `STRY` | `POST /stories` request | `stry.ksy` |

    ## Errors

    Every 4xx except 401 carries a one-line English reason as `text/plain`, naming the rule
    and the field (`lang: unknown id 'fr'`, `story removed`). A 409 for a published
    translation missing from a `POST /stories` body names the language
    (`pt-BR: published, missing from body`). A 401 has an empty body. A 500 (SQLite
    error) has no body.

    A malformed request head, or one over 8 KiB, gets a 400 `bad request head` and the
    connection closes. Any path or method not listed here, HEAD included, gets a 404
    `not found`.
    The backend sends no CORS headers.
servers:
  - url: http://127.0.0.1:8080
    description: Default bind address and port (POSTILLA_BIND, POSTILLA_PORT); TLS is the reverse proxy's job
tags:
  - name: feed
    description: What the learner app reads; public
  - name: stories
    description: Publishing and removing stories; called by the `postilla` CLI

paths:
  /stories:
    get:
      tags: [feed]
      operationId: getFeed
      summary: Translations published, corrected or removed after a cursor
      description: |
        Returns one record per translation in the listed languages whose cursor is greater
        than `since`, ascending by cursor. Removed translations are returned like any other,
        `since=0` included. The app builds each `.tilla.gz` URL from a record's `id`, `lang`
        and `sha256` (`stories/<id>/<lang>/<sha256>.tilla.gz`), and the `.opus` URL from the
        `.tilla`. `sha256` is the hash of the `.tilla` before gzip.
      security: []
      parameters:
        - name: since
          in: query
          required: false
          description: |
            The newest cursor the app has, a decimal `u32`. Missing counts as 0, which returns
            every translation in the listed languages. Any other value gets a 400.
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 4294967295
            default: 0
        - name: lang
          in: query
          required: true
          description: |
            1 to 4 comma-separated language ids (`it,pt-BR`), each in `language`, with no
            duplicates and no empty items.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 4
            uniqueItems: true
            items:
              type: string
              minLength: 1
              maxLength: 8
            examples:
              - [it, pt-BR]
      responses:
        "200":
          description: |
            `FEED` body ([feed.ksy](formats/feed.ksy)), `9 + 61 × count` bytes:

            | Field | Type | Value |
            |---|---|---|
            | `magic` | 4 bytes | `FEED` |
            | `version` | `u8` | `1` |
            | `count` | `u32` | Number of records that follow |

            Then `count` records of 61 bytes, ascending by `cursor`:

            | Field | Type | Value |
            |---|---|---|
            | `id` | `uuid` | Story id |
            | `lang` | `lang` | The translation's language |
            | `change` | `u8` | What happened last to that translation: 1 `published` (new or changed) or 2 `removed` |
            | `sha256` | `sha256` | sha256 of the translation's `.tilla`, before gzip; all zero when `removed` |
            | `cursor` | `u32` | The translation's cursor |

            When nothing is new, the body is the 9-byte header with `count` 0.
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/Binary"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`since` isn't 1 to 10 decimal digits of a `u32` (`since: not a u32`) or is repeated (`since: repeated`); or `lang` is missing (`lang: missing`), repeated (`lang: repeated`), has an empty item (`lang: empty id`), more than 4 ids (`lang: more than 4 ids`), a duplicate (`lang: duplicate id 'it'`), or an id not in `language` (`lang: unknown id 'fr'`)"
        "500":
          $ref: "#/components/responses/DatabaseError"

    post:
      tags: [stories]
      operationId: publishStory
      summary: Publish or republish every translation of a story
      description: |
        The story's files must already be in R2 under `stories/<id>/<lang>/<sha256>.tilla.gz`
        (and its `.opus`/`.flac`); `postilla publish` uploads them first, and the server
        doesn't check that they exist. Every translation in the body is upserted in one
        transaction: a new translation, or one whose sha256 changed, gets `change` `published`
        and the next cursor; one whose sha256 is the same keeps its cursor. A story that
        already has a published translation in a language the body doesn't carry gets a 409;
        there is no override.
      security:
        - authorToken: []
      requestBody:
        required: true
        description: |
          `STRY` body ([stry.ksy](formats/stry.ksy)), `22 + 40 × lang_count` bytes:

          | Field | Type | Value |
          |---|---|---|
          | `magic` | 4 bytes | `STRY` |
          | `version` | `u8` | `1` |
          | `id` | `uuid` | Story id |
          | `lang_count` | `u8` | Number of translations that follow |

          Then `lang_count` translations:

          | Field | Type | Value |
          |---|---|---|
          | `lang` | `lang` | The translation's language |
          | `sha256` | `sha256` | sha256 of its `.tilla`, before gzip |

          The parse rejects with 400 when any of these fail:

          1. The magic is `STRY` and the version is 1.
          2. `lang_count` is at least 1, and the body is exactly `22 + 40 × lang_count` bytes.
          3. Every `lang` is non-empty ASCII followed only by zero bytes, and no `lang` repeats.
          4. One `lang` is `it`, the original.
        content:
          application/octet-stream:
            schema:
              $ref: "#/components/schemas/Binary"
      responses:
        "200":
          $ref: "#/components/responses/Done"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "The body fails the parse, or a `lang` isn't in `language` (`lang: unknown id 'fr'`)"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The story was removed (`story removed`), or it has a published translation the body doesn't carry (`pt-BR: published, missing from body`)"
        "500":
          $ref: "#/components/responses/DatabaseError"

  /stories/{id}:
    delete:
      tags: [stories]
      operationId: removeStory
      summary: Remove a story
      description: |
        Tombstones every translation of the story at once, in one transaction: each row's
        `change` becomes `removed`, its `sha256` is sent as zeros in the feed, and it gets a
        new cursor, so a syncing app deletes its copy. Nothing is deleted from the database
        or from R2. A single translation can't be removed. A removed id stays removed:
        `POST /stories` with it gets a 409. Removing a story that is
        already removed answers 200 and changes nothing (no new cursor). No request body.
      security:
        - authorToken: []
      parameters:
        - $ref: "#/components/parameters/StoryId"
      responses:
        "200":
          $ref: "#/components/responses/Done"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`id` isn't a UUID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: Unknown story id
        "500":
          $ref: "#/components/responses/DatabaseError"

  /genres:
    get:
      tags: [feed]
      operationId: listGenres
      summary: Every genre, with its name in each language
      security: []
      responses:
        "200":
          description: |
            `GNRS` body ([gnrs.ksy](formats/gnrs.ksy)):

            | Field | Type | Value |
            |---|---|---|
            | `magic` | 4 bytes | `GNRS` |
            | `version` | `u8` | `1` |
            | `count` | `u16` | Number of records that follow |

            Then `count` records, ascending by `id`:

            | Field | Type | Value |
            |---|---|---|
            | `id` | `str` | Genre id |
            | `it` | `str` | Italian name |
            | `pt_br` | `str` | Brazilian Portuguese name |
            | `en` | `str` | English name |
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/Binary"
        "500":
          $ref: "#/components/responses/DatabaseError"

  /tags:
    get:
      tags: [feed]
      operationId: listTags
      summary: Every tag, with its name in each language
      security: []
      responses:
        "200":
          description: |
            `TAGS` body ([tags.ksy](formats/tags.ksy)):

            | Field | Type | Value |
            |---|---|---|
            | `magic` | 4 bytes | `TAGS` |
            | `version` | `u8` | `1` |
            | `count` | `u16` | Number of records that follow |

            Then `count` records, ascending by `id`:

            | Field | Type | Value |
            |---|---|---|
            | `id` | `str` | Tag id |
            | `it` | `str` | Italian name |
            | `pt_br` | `str` | Brazilian Portuguese name |
            | `en` | `str` | English name |
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/Binary"
        "500":
          $ref: "#/components/responses/DatabaseError"

  /authors:
    get:
      tags: [feed]
      operationId: listAuthors
      summary: Every author
      security: []
      responses:
        "200":
          description: |
            `AUTH` body ([auth.ksy](formats/auth.ksy)):

            | Field | Type | Value |
            |---|---|---|
            | `magic` | 4 bytes | `AUTH` |
            | `version` | `u8` | `1` |
            | `count` | `u16` | Number of records that follow |

            Then `count` records, ascending by `id`:

            | Field | Type | Value |
            |---|---|---|
            | `id` | `str` | Author id |
            | `name` | `str` | Author name |
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/Binary"
        "500":
          $ref: "#/components/responses/DatabaseError"

  /languages:
    get:
      tags: [feed]
      operationId: listLanguages
      summary: Every language
      security: []
      responses:
        "200":
          description: |
            `LANG` body ([lang.ksy](formats/lang.ksy)):

            | Field | Type | Value |
            |---|---|---|
            | `magic` | 4 bytes | `LANG` |
            | `version` | `u8` | `1` |
            | `count` | `u16` | Number of records that follow |

            Then `count` records, ascending by `id`:

            | Field | Type | Value |
            |---|---|---|
            | `id` | `str` | Language id |
            | `name` | `str` | The language's own name |
            | `target` | `u8` | 1 when the language can be a target, 0 otherwise |
            | `translate` | `u8` | 1 when stories are translated into it |
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/Binary"
        "500":
          $ref: "#/components/responses/DatabaseError"

components:
  securitySchemes:
    authorToken:
      type: http
      scheme: bearer
      description: |
        The token in env `POSTILLA_AUTHOR_TOKEN`, compared in constant time. A missing or
        wrong token gets a 401 with an empty body, before the body is read.
        `POST /stories` and `DELETE /stories/{id}` need it; `GET /stories`, `GET /genres`,
        `GET /tags`, `GET /authors` and `GET /languages` are public.
  parameters:
    StoryId:
      name: id
      in: path
      required: true
      description: Story UUID in its written form
      schema:
        type: string
        format: uuid
        examples: [d0159518-99cc-46f0-bef2-b5b6f6f9a76d]
  schemas:
    Binary:
      type: string
      contentMediaType: application/octet-stream
      description: Big-endian binary body; the layout is in the operation's description
    Reason:
      type: string
      description: One line of English naming the rule and the field
      examples:
        - "lang: unknown id 'fr'"
        - story removed
        - "pt-BR: published, missing from body"
  responses:
    Done:
      description: Done. No body.
    BadRequest:
      description: The request breaks a rule; the body names it
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/Reason"
    Unauthorized:
      description: Missing or wrong bearer token. Empty body.
    NotFound:
      description: Not found; the body says what
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/Reason"
    Conflict:
      description: The request conflicts with the stored state; the body names the rule
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/Reason"
    DatabaseError:
      description: SQLite error. No body.
