# Every test, once: the Zig suite and the generated Dart normalization against the Zig one
# (test-dart, the only one that needs the Dart SDK). Runs on every branch push and pull
# request, and deploy.yml calls it before it builds (infra/README.md, GitHub Actions).
name: test

on:
  push:
    branches: ["**"] # tags run deploy.yml, which calls this
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      # On a cold cache the build fetches the lazy dependencies concurrently, and Zig 0.17's
      # HTTP client fails the second xiph.org download (HttpConnectionClosing); --fetch=all
      # fetches them up front and works.
      - run: zig build --fetch=all
      - run: zig build test
      - run: zig build test-dart
      - run: zig fmt --check build.zig src test

  # The golden files (test/golden/, which `zig build test` compares byte for byte) against the
  # formats' Kaitai specs: a spec that drifts from the writer fails here.
  formats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kaitai-struct-compiler 0.11 and its Python runtime
        run: |
          curl -fsSL -o ksc.deb https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/0.11/kaitai-struct-compiler_0.11_all.deb
          echo "28d6b6ec917e394ed41cb6f62169a8f6b584d9a5242cbe0785b0568d95e032ea  ksc.deb" | sha256sum -c -
          sudo apt-get install -y ./ksc.deb
          pip install --user kaitaistruct==0.11
      - run: python3 tools/check_formats.py
