# Tests and deploys postilla-server with infra/deploy.sh (infra/README.md, GitHub Actions).
# A pushed version tag deploys to staging. Production is a manual run on a tag:
# Actions → deploy → Run workflow, pick the tag and "production".
name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      server:
        description: Server to deploy to
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

# One deploy at a time; a queued one waits instead of cancelling the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Every test, once: the Zig suite and the generated Dart normalization against the Zig one
  # (test-dart, the only one that needs the Dart SDK).
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - uses: dart-lang/setup-dart@v1
      # On a cold cache the build fetches the lazy dependencies concurrently, and Zig 0.17's
      # HTTP client fails the second xiph.org download (HttpConnectionClosing); --fetch=all
      # fetches them up front and works.
      - run: zig build --fetch=all
      - run: zig build test
      - run: zig build test-dart

  deploy:
    needs: tests
    runs-on: ubuntu-24.04
    environment: ${{ inputs.server || 'staging' }}
    env:
      SERVER: ${{ inputs.server || 'staging' }}
    steps:
      - name: Production takes only a version tag
        if: env.SERVER == 'production' && github.ref_type != 'tag'
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "::error::production deploys a version tag; $REF is a branch"
          exit 1

      # Full history and tags: the build embeds the latest tag and the commit (--version).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The Zig version comes from minimum_zig_version in build.zig.zon.
      - uses: mlugg/setup-zig@v2

      # As in the tests job: fetch the lazy dependencies before the build does.
      - run: zig build --fetch=all

      # As deploy, whose key runs only postilla-update (infra/README.md, GitHub Actions).
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          grep -v '^#' infra/known_hosts > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          POSTILLA_DEPLOY_KEY=~/.ssh/deploy_key infra/deploy.sh "$SERVER" deploy@api.postilla.kaiodelphino.com
